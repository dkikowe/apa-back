# Development infrastructure. Real personal data must never be used here.
services:
  mongo:
    image: mongo:8
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27018"]
    ports: ["127.0.0.1:27018:27018"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --port 27018 --quiet --eval ''try { rs.status().ok } catch(e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27018"}]}) }''',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
    volumes: ["storage-data:/data"]
volumes:
  mongo-data:
  storage-data:
